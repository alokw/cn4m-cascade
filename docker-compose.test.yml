# Integration harness: two Samba servers plus a dev container that owns the
# CIFS mounts. Bridge network with static IPs — targets are addressed by IP
# (SPEC.md §1). Production compose uses network_mode: host (SPEC.md §3.3);
# that does not work on Docker Desktop for macOS, hence a bridge here
# (PROGRESS.md B-3).
services:
  samba-a:
    build: ./test/samba
    container_name: cn4m-cascade-samba-a
    networks:
      smbnet:
        ipv4_address: 172.28.0.10

  samba-b:
    build: ./test/samba
    container_name: cn4m-cascade-samba-b
    networks:
      smbnet:
        ipv4_address: 172.28.0.11

  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cn4m-cascade-dev
    cap_add: [SYS_ADMIN, DAC_READ_SEARCH, NET_ADMIN]
    security_opt: [apparmor:unconfined]
    environment:
      # 172.28.0.99 is deliberately unassigned: the offline-host test target.
      CN4M_CASCADE_TEST_SAMBA_A: 172.28.0.10
      CN4M_CASCADE_TEST_SAMBA_B: 172.28.0.11
      CN4M_CASCADE_TEST_OFFLINE: 172.28.0.99
      ENCRYPTION_KEY: test-encryption-key-not-for-production
      # Cron schedules are read in the server's local time, which in a
      # container is UTC unless this says otherwise — so "0 2 * * *" would
      # mean 2am UTC rather than 2am where you are. Set TZ in your shell or a
      # .env file (e.g. TZ=America/New_York) and the job editor's preview will
      # agree with the clock on your wall.
      # Pinned for the same reason: schedule tests assert against UTC, and a
      # developer's TZ in .env must not change what they assert.
      TZ: "UTC"
      # Where this reports its status in the cn4m suite. Defaults to cn4m on
      # the same machine; point it at another host, or set it to "off", when
      # that is not true. Only ever used to create the callback on a fresh
      # database — after that the row is editable in the UI and this variable
      # will not overwrite it.
      # Pinned, not interpolated: compose auto-loads `.env` for *every* file in
      # this directory, so a production .env would otherwise silently
      # reconfigure the harness. Tests must not depend on deployment settings.
      CN4M_CASCADE_STATUS_URL: "off"
    volumes:
      - .:/src
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
      # A folder on YOUR machine, usable as a "local" sync target. Inside the
      # container it is always /mnt/local, so that is the path you type when
      # creating a local target in the UI — regardless of where it lives on
      # your host.
      #
      # Default: ~/cn4m on macOS and Linux, %USERPROFILE%\cn4m on Windows.
      # `make harness-up` creates it if it does not exist.
      #
      # To use a different folder, set CN4M_CASCADE_LOCAL_DIR — either in your shell
      # or in a .env file beside this one:
      #
      #     CN4M_CASCADE_LOCAL_DIR=/Volumes/media/to-back-up
      #
      # The nesting below is the cross-platform part: HOME is set on macOS and
      # Linux, USERPROFILE on Windows. Docker Desktop accepts forward slashes
      # in a Windows path, so C:\Users\you/cn4m resolves correctly.
      - ${CN4M_CASCADE_LOCAL_DIR:-${HOME:-${USERPROFILE:-/tmp}}/cn4m}:/mnt/local
    # Reachable from the host browser for the manual pass.
    #
    # Published on 12649, NOT 2649: the production stack owns 2649, and a
    # published port is bound by Docker whether or not anything inside the
    # container is listening. Sharing the number meant `make run` failed with
    # "port is already allocated" whenever the harness was up — the same
    # class of collision this phase exists to end, one layer down.
    #
    # Inside the container the server still listens on 2649, so the Vite proxy
    # and every test are unaffected; only the host-side number differs.
    ports:
      - "12649:2649"   # make dev-run  -> http://localhost:12649
      - "5173:5173"    # make web-dev
    working_dir: /src
    networks: [smbnet]
    depends_on: [samba-a, samba-b]
    command: sleep infinity

networks:
  smbnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  gomodcache:
  gobuildcache:
