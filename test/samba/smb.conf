[global]
   workgroup = WORKGROUP
   server string = smbsync test server
   security = user
   map to guest = Bad User
   guest account = nobody
   server min protocol = SMB2
   server max protocol = SMB3
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log level = 1
   log file = /var/log/samba/log.%m
   max log size = 1000
   unix extensions = no

[public]
   comment = guest-writable share
   path = /srv/public
   browseable = yes
   read only = no
   guest ok = yes
   force user = root
   create mask = 0644
   directory mask = 0755

[private]
   comment = credentialed share
   path = /srv/private
   browseable = yes
   read only = no
   guest ok = no
   valid users = syncuser, otheruser
   force user = root
   create mask = 0644
   directory mask = 0755
